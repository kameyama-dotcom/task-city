<body>
  <div id="app"></div>
  <script>
const DEFAULT_TAGS = {
  work:{name:'仕事',icon:'💼'}, home:{name:'家庭',icon:'🏠'}, play:{name:'遊び',icon:'🎮'}, goal:{name:'目標',icon:'🎯'}
};
let TAGS = {...DEFAULT_TAGS};
const QUADS = {
  hh:{name:'高・高',color:'var(--hh)'}, hl:{name:'高・低',color:'var(--hl)'}, lh:{name:'低・高',color:'var(--lh)'}, ll:{name:'低・低',color:'var(--ll)'}
};
const POINTS=[10,20,30,50,80];
const STORAGE_KEY='taskCityState';
const DATA_VERSION=4;
function makeId(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID()}catch(e){}return 't_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10)}
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const addDays=(date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d};
const appDayDate=()=>{const d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);return d};
const today=()=>iso(appDayDate());
const wd=d=>['日','月','火','水','木','金','土'][new Date(d+'T00:00:00').getDay()];
const fmt=d=>{if(!d)return 'なし';const x=new Date(d+'T00:00:00');return `${x.getMonth()+1}/${x.getDate()}（${wd(d)}）`};

let state=migrateState(load());
TAGS=state.tags;
let ui={view:'today',modal:null,detailId:null,addTag:null,snack:null,radial:false,radialSel:null,tagDrafts:null,cityBurst:null};
let addGesture={timer:null,holding:false};

function seed(){
  const t=today();
  const d=n=>iso(addDays(appDayDate(),n));
  return {tags:JSON.parse(JSON.stringify(DEFAULT_TAGS)),quickTags:['work','home','play','goal'],tasks:[
    task('企画書の修正を終わらせる','work','hh',d(0),'1800',d(0),50,45),
    task('保険について比較して候補を3つに絞る','goal','hl',d(2),'',d(0),50,40),
    task('洗濯物を畳む','home','ll','', '',d(0),10,10),
    task('Aさんに返信する','work','lh',d(1),'1200',d(0),10,5),
    task('週末に行く場所を調べる','play','ll','', '',d(1),20,20),
    task('家の書類を整理する','home','hl','', '',null,30,30),
    task('目標の勉強計画を見直す','goal','hl',d(10),'',null,30,25),
  ],history:[],version:DATA_VERSION,monthKey:currentMonthKey(),lastWeeklySeenKey:'',updatedAt:new Date().toISOString()};
}
function migrateState(s){
  s=s&&typeof s==='object'?s:seed();
  const from=Number(s.version||1);
  if(!s.tags)s.tags=JSON.parse(JSON.stringify(DEFAULT_TAGS));
  if(!s.quickTags)s.quickTags=Object.keys(s.tags).slice(0,6);
  if(!('landmark' in s))s.landmark='observatory';
  if(!s.monthKey)s.monthKey=currentMonthKey();
  if(!('lastWeeklySeenKey' in s))s.lastWeeklySeenKey='';
  if(!Array.isArray(s.tasks))s.tasks=[];
  if(!Array.isArray(s.history))s.history=[];
  s.tasks.forEach(t=>{if(!('bonus' in t))t.bonus=0;if(!('awardedPoints' in t))t.awardedPoints=t.completedAt?(t.points||0):null;if(!('subtasks' in t))t.subtasks=[]});
  s.quickTags=s.quickTags.filter(k=>s.tags[k]).slice(0,6);
  s.version=DATA_VERSION;
  s.updatedAt=s.updatedAt||new Date().toISOString();
  if(from<DATA_VERSION){try{localStorage.setItem('taskCityPreMigrationBackup_v'+DATA_VERSION,JSON.stringify(s))}catch(e){}}
  return s;
}
function refreshTags(){TAGS=state.tags;}
function quickTags(){return (state.quickTags||[]).filter(k=>TAGS[k]).slice(0,6)}
function safeTag(id){return TAGS[id]||{name:'タグ',icon:'🏷️'}}

function task(content,tag,quad,deadline,deadlineTime,planDate,points,minutes){return {id:makeId(),content,tag,quad,deadline,deadlineTime,planDate,planTime:'',points,minutes,createdAt:new Date().toISOString(),completedAt:null,skips:0,parentId:null,subtasks:[]}}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||seed()}catch(e){return seed()}}
function save(){state.version=DATA_VERSION;state.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function backupPayload(){return {app:'Task City',formatVersion:1,exportedAt:new Date().toISOString(),dataVersion:DATA_VERSION,state:state}}
function exportBackup(){
  const json=JSON.stringify(backupPayload(),null,2),blob=new Blob([json],{type:'application/json'}),name=`task-city-backup-${today()}.json`;
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){navigator.share({title:'Task City バックアップ',files:[file]}).catch(()=>{});return}}catch(e){}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)
}
function importBackupFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),candidate=parsed&&parsed.state?parsed.state:parsed;if(!candidate||!Array.isArray(candidate.tasks))throw new Error('invalid');localStorage.setItem('taskCityBeforeRestore',JSON.stringify(state));state=migrateState(candidate);refreshTags();save();ui.snack={text:`バックアップを復元しました（${state.tasks.length}件）`,id:null};render();setTimeout(()=>{ui.snack=null;render()},3200)}catch(e){ui.snack={text:'バックアップを読み込めませんでした',id:null};render();setTimeout(()=>{ui.snack=null;render()},3200)}};r.readAsText(file)}
function active(){return state.tasks.filter(t=>!t.completedAt)}
function completedThisMonth(){const n=new Date();return state.tasks.filter(t=>t.completedAt&&new Date(t.completedAt).getMonth()===n.getMonth()&&new Date(t.completedAt).getFullYear()===n.getFullYear())}
function monthPoints(){return completedThisMonth().reduce((s,t)=>s+(t.awardedPoints||t.points||0),0)}
function tagPoints(tag){return completedThisMonth().filter(t=>t.tag===tag).reduce((s,t)=>s+(t.awardedPoints||t.points||0),0)}
function unplanned(){return active().filter(t=>!t.planDate && !t.parentId)}
function todayTasks(){
  const t=today();
  return active().filter(x=>x.planDate===t && (!x.parentId || true)).sort(scoreSort)
}
function scoreSort(a,b){
  const time=x=>x.planTime?Number(x.planTime):9999;
  if(time(a)!==time(b))return time(a)-time(b);
  const q={hh:0,hl:1,lh:2,ll:3}; if(q[a.quad]!==q[b.quad])return q[a.quad]-q[b.quad];
  return (b.skips||0)-(a.skips||0) || Math.random()-.5;
}
function estimatePoints(content){
  const s=content.length; const heavy=/(企画|完成|比較|整理|作成|設計|勉強|調査|見直)/.test(content);
  if(s>24&&heavy)return 50;if(heavy)return 30;if(s>18)return 20;return 10;
}
function estimateMinutes(content,points){return ({10:10,20:20,30:30,50:45,80:90})[points]||30}
function bonusFor(t){return t.quad==='hl' && (!t.deadline || new Date(t.deadline+'T23:59:59')-Date.now()>2*86400000)?10:0}


function currentMonthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const mondayOffset=(x.getDay()+6)%7;x.setDate(x.getDate()-mondayOffset);return x}
function weekKey(d=new Date()){return iso(startOfWeek(d))}
function weekRange(key){const a=new Date(key+'T00:00:00'),b=addDays(a,6);return `${a.getMonth()+1}/${a.getDate()}〜${b.getMonth()+1}/${b.getDate()}`}
function completedInWeek(key){const a=new Date(key+'T00:00:00'),b=addDays(a,7);return state.tasks.filter(t=>{if(!t.completedAt)return false;const d=new Date(t.completedAt);return d>=a&&d<b})}
function weeklyStats(key=weekKey()){const ts=completedInWeek(key);const sums={work:0,home:0,play:0,goal:0};let bonus=0;for(const t of ts){const kind=districtForTag(t.tag);sums[kind]+=(t.awardedPoints||t.points||0);if((t.bonus||0)>0)bonus++}const order=Object.entries(sums).sort((a,b)=>b[1]-a[1]);const dominant=order[0][1]>0?order[0][0]:'work';const points=ts.reduce((a,t)=>a+(t.awardedPoints||t.points||0),0);return {key,tasks:ts,points,sums,dominant,bonus}}
function weekComment(stats){if(!stats.tasks.length)return '今週の街づくりは、まだこれから。1つ終えるだけでも街に変化が生まれます。';let base=stats.dominant==='work'?'仕事エリアがぐっと前進。今週も街が頼もしくなりました！':stats.dominant==='home'?'暮らしのエリアがにぎやかに。日々のことをちゃんと積み上げました！':stats.dominant==='play'?'遊びのエリアに灯りが増えました。楽しい時間も街の大事な一部です！':'ランドマークがまた一歩完成へ。未来のための行動が形になりました！';if(stats.bonus)base+=` 大事なことを${stats.bonus}件、先回りできています。`;return base}
function activeWeekFlags(){const groups={};for(const t of completedThisMonth()){const k=weekKey(new Date(t.completedAt));(groups[k]||(groups[k]=[])).push(t)}return Object.keys(groups).sort().slice(-5).map(k=>weeklyStats(k))}
function weekFlagsSvg(){const flags=activeWeekFlags();const pos=[[205,276],[250,286],[300,291],[350,286],[395,276]];return flags.map((st,i)=>{const [x,y]=pos[i]||pos[pos.length-1];const c=districtColor(st.dominant);return `<g class="week-flag" transform="translate(${x} ${y})"><path d="M0 0v-23" stroke="#596a6f" stroke-width="2"/><path d="M1 -22q13 3 18-1v10q-8 4-18 0z" fill="${c}" stroke="#fff" stroke-width="1"/><circle cx="0" cy="1" r="2.3" fill="#596a6f"/></g>`}).join('')}
function ensureMonthLifecycle(){const mk=currentMonthKey();if(state.monthKey!==mk){state.monthKey=mk;state.landmark=null;state.lastWeeklySeenKey='';save()}if(!state.landmark&&!ui.modal){ui.modal='landmarkPick'}}
function maybeOpenWeeklyReport(){if(ui.modal)return;const prev=weekKey(addDays(new Date(),-7));const st=weeklyStats(prev);if(st.tasks.length&&state.lastWeeklySeenKey!==prev){state.lastWeeklySeenKey=prev;save();ui.weekKey=prev;ui.modal='weekly';render()}}

function render(){
  document.getElementById('app').innerHTML=`
    <div class="topbar"><div class="brand">TASK CITY</div><div style="display:flex;gap:5px" aria-label="palette"><i style="width:12px;height:12px;border-radius:50%;background:var(--hl)"></i><i style="width:12px;height:12px;border-radius:50%;background:var(--hh)"></i><i style="width:12px;height:12px;border-radius:50%;background:var(--lh)"></i><i style="width:12px;height:12px;border-radius:50%;background:var(--ll)"></i></div></div>
    <main>${viewHtml()}</main>${navHtml()}${ui.modal?modalHtml():''}${ui.radial?radialHtml():''}${ui.snack?snackHtml():''}`;
  bind();
}

function districtForTag(tag){if(tag==='work')return 'work';if(tag==='home')return 'home';if(tag==='play')return 'play';if(tag==='goal')return 'goal';const n=(safeTag(tag).name||'');if(/仕事|業務|会社/.test(n))return 'work';if(/家庭|家事|家族|生活/.test(n))return 'home';if(/遊|趣味|ゲーム|娯楽/.test(n))return 'play';if(/目標|勉強|学習|成長/.test(n))return 'goal';return 'home'}
function districtPoints(kind){return completedThisMonth().filter(t=>districtForTag(t.tag)===kind).reduce((s,t)=>s+(t.awardedPoints||t.points||0),0)}
function cityUnit(p){return Math.min(12,Math.floor(Math.max(0,p)/10))}
function blockSvg(x,y,w,h,d,top,front,side,cls=''){const A=`${x},${y-h-d/2}`,B=`${x+w/2},${y-h}`,C=`${x},${y-h+d/2}`,D=`${x-w/2},${y-h}`,B2=`${x+w/2},${y}`,C2=`${x},${y+d/2}`,D2=`${x-w/2},${y}`;return `<g class="${cls}"><polygon points="${D} ${C} ${C2} ${D2}" fill="${front}"/><polygon points="${C} ${B} ${B2} ${C2}" fill="${side}"/><polygon points="${A} ${B} ${C} ${D}" fill="${top}" stroke="rgba(255,255,255,.72)" stroke-width="1"/></g>`}
function treeSvg(x,y,s=1,leaf='#68cf58'){return `<g><ellipse cx="${x}" cy="${y}" rx="${7*s}" ry="${3*s}" fill="rgba(56,102,70,.15)"/><rect x="${x-1.7*s}" y="${y-14*s}" width="${3.4*s}" height="${13*s}" rx="1" fill="#96663f"/><circle cx="${x}" cy="${y-18*s}" r="${8*s}" fill="${leaf}"/><circle cx="${x-5*s}" cy="${y-16*s}" r="${5*s}" fill="${leaf}"/></g>`}
function personSvg(x,y,c='#ff5c8a'){return `<g><circle cx="${x}" cy="${y-8}" r="3" fill="#704637"/><path d="M${x} ${y-5} l-4 8 h8z" fill="${c}"/><path d="M${x-2} ${y+2} l-2 6 M${x+2} ${y+2} l2 6" stroke="#4d5360" stroke-width="2" stroke-linecap="round"/></g>`}
function lampSvg(x,y){return `<g><path d="M${x} ${y}v-20" stroke="#455c64" stroke-width="2.3"/><circle cx="${x}" cy="${y-22}" r="4.5" fill="#ffe36a" stroke="#fff" stroke-width="1.5"/></g>`}
function flagSvg(x,y,c='#ff5c8a'){return `<g><path d="M${x} ${y}v-25" stroke="#596a6f" stroke-width="2"/><path d="M${x+1} ${y-24}q13 3 18-1v11q-8 4-18 0z" fill="${c}"/></g>`}
function ferrisSvg(x,y,s=1){return `<g><circle cx="${x}" cy="${y-22*s}" r="${17*s}" fill="none" stroke="#ff5c8a" stroke-width="${3*s}"/><path d="M${x} ${y-22*s}v${17*s} M${x-15*s} ${y-29*s}l${30*s} ${14*s} M${x-15*s} ${y-15*s}l${30*s} -14" stroke="#68cfe8" stroke-width="${1.5*s}"/><path d="M${x-10*s} ${y}l${10*s} -18 l${10*s} 18" fill="none" stroke="#5a6570" stroke-width="${3*s}"/></g>`}
function landmarkSvg(kind,stage){const s=Math.max(0,Math.min(5,stage)),x=300,y=186;if(kind==='ferris'){if(s===0)return `<g><ellipse cx="300" cy="190" rx="34" ry="17" fill="#d9b980"/><text x="300" y="194" text-anchor="middle" font-size="13">🎡</text></g>`;return `<g>${ferrisSvg(x,y+8,.55+s*.11)}${s>=4?`<circle cx="${x+26}" cy="${y-37}" r="4" fill="#ffbd38"/>`:''}</g>`}if(kind==='clocktower'){if(s===0)return `<g><ellipse cx="300" cy="192" rx="35" ry="17" fill="#d9b980"/><text x="300" y="196" text-anchor="middle" font-size="13">🕰️</text></g>`;let h=18+s*9;return `<g>${blockSvg(x,y,44,h,22,'#fff0a9','#f5c650','#e9a83f')}${s>=2?`<circle cx="300" cy="${y-h+10}" r="9" fill="#fff" stroke="#45616a" stroke-width="2"/><path d="M300 ${y-h+10}v-5 M300 ${y-h+10}l5 2" stroke="#45616a" stroke-width="1.5"/>`:''}${s>=4?`<path d="M300 ${y-h-20}l-12 20h24z" fill="#19c5c7"/>`:''}</g>`}/* observatory */ if(s===0)return `<g><ellipse cx="300" cy="192" rx="35" ry="17" fill="#d9b980"/><text x="300" y="196" text-anchor="middle" font-size="13">🔭</text></g>`;let h=15+s*6;return `<g>${blockSvg(x,y,54,h,25,'#d7f7fb','#76d6df','#55b9c7')}${s>=2?`<path d="M276 ${y-h} Q300 ${y-h-37-s*2} 324 ${y-h} Z" fill="#f5fbff" stroke="#83b9c4" stroke-width="2"/>`:''}${s>=4?`<path d="M306 ${y-h-17}l22 -14" stroke="#546b75" stroke-width="5" stroke-linecap="round"/><circle cx="330" cy="${y-h-32}" r="5" fill="#ffbd38"/>`:''}</g>`}
function citySvgHtml(extra=''){const w=cityUnit(districtPoints('work')),h=cityUnit(districtPoints('home')),p=cityUnit(districtPoints('play')),g=cityUnit(districtPoints('goal'));const landmark=state.landmark||'observatory';const goalStage=Math.min(5,Math.floor(g/2));return `<svg class="city-svg ${extra}" viewBox="0 0 600 315" preserveAspectRatio="xMidYMid meet" aria-label="今月育てている街">

<g class="district-home">${h>=1?treeSvg(414,112,1.05):''}${h>=2?blockSvg(455,132,50,25,24,'#fff0b7','#ffcf64','#e7ad49'):''}${h>=3?personSvg(390,137,'#76d34f'):''}${h>=4?blockSvg(400,101,44,31,21,'#ffd6df','#ff8eaa','#e6708f'):''}${h>=5?treeSvg(498,146,.9,'#76d34f'):''}${h>=6?blockSvg(492,112,46,30,22,'#e7f9cf','#92d965','#6fc34d'):''}${h>=7?`<path d="M429 153q22-13 43 0" stroke="#58bff5" stroke-width="8" stroke-linecap="round"/><circle cx="445" cy="146" r="3" fill="#fff"/>`:''}${h>=8?treeSvg(370,88,.85,'#72d95b'):''}${h>=10?blockSvg(438,81,42,40,20,'#fff','#8bdbe2','#61bfc8'):''}${h>=12?treeSvg(520,116,1.15,'#5bc94d'):''}</g>

function cityHtml(){const p=monthPoints();const grow=ui.cityBurst?`grow-${districtForTag(ui.cityBurst.tag)}`:'';return `<section class="panel city"><div class="city-head"><span class="city-month">${new Date().toLocaleString('en',{month:'long'}).toUpperCase()} CITY</span><span class="city-pts">★ ${p.toLocaleString()}</span></div><div class="city-stage">${citySvgHtml(grow)}${ui.cityBurst?`<div class="city-burst" style="--burst:${districtColor(districtForTag(ui.cityBurst.tag))}">+${ui.cityBurst.points}</div>`:''}</div><div class="city-legend"><span>💼 ${districtPoints('work')}</span><span>🏠 ${districtPoints('home')}</span><span>🎮 ${districtPoints('play')}</span><span>🎯 ${districtPoints('goal')}</span></div></section>`}
function districtColor(k){return k==='work'?'#19c5c7':k==='home'?'#76d34f':k==='play'?'#ff5c8a':'#ffbd38'}
function todayHtml(){const ts=todayTasks();const done=state.tasks.filter(t=>t.completedAt&&iso(t.completedAt)===today()).length;const up=unplanned();return `${cityHtml()}<div class="today-strip"><span class="today-count">今日のタスク　${done}/${ts.length+done}</span><button class="inbox-mini ${needsPlanAttention(up)?'warn':''}" data-view="plan" title="未計画">未 ${up.length}</button></div><div class="cards">${ts.slice(0,3).map((t,i)=>cardHtml(t,i===0)).join('')||`<div class="panel empty">☕<br><span class="subtle">予定なし</span></div>`}</div>${ts.length>3?`<div class="hint">あと ${ts.length-3}</div>`:''}`}
function needsPlanAttention(up){return up.length>=5||up.some(t=>t.quad==='hl'||t.quad==='hh'||(t.deadline&&new Date(t.deadline)-Date.now()<7*86400000))}
const PRIORITY_ICONS={hh:'assets/hh.png',hl:'assets/hl.png',lh:'assets/lh.png',ll:'assets/ll.png'};
function priorityIcons(q){return `<span class="priority-badge" style="--prio:${QUADS[q].color}"><img src="${PRIORITY_ICONS[q]}" alt="" draggable="false"></span>`}
function cardHtml(t,primary){const dl=compactDeadline(t),tag=safeTag(t.tag);return `<article class="task-card ${primary?'primary':''}" data-task="${t.id}" style="--accent:${QUADS[t.quad].color}"><div class="task-line"><span class="priority-icons" title="重要度・緊急度">${priorityIcons(t.quad)}</span><span class="task-tag-only" title="${escAttr(tag.name)}">${tag.icon}</span><span class="task-title-inline">${esc(t.content)}</span><span class="points">★${t.points}</span></div><div class="task-meta"><span class="deadline-compact ${dl.hot?'hot':''}">${dl.text}</span><span>${t.planDate?`実行予定 ${fmt(t.planDate)}${t.planTime?' '+hhmm(t.planTime):''}`:''}</span><span>${t.minutes?`予測 ${t.minutes}分`:''}</span></div></article>`}
function compactDeadline(t){if(!t.deadline)return {text:'',hot:false};const diff=Math.ceil((new Date(t.deadline+'T23:59:59')-Date.now())/86400000);const time=t.deadlineTime?' '+hhmm(t.deadlineTime):'';if(diff<0)return {text:`〆切 ${Math.abs(diff)}日超過`,hot:true};if(diff===0)return {text:`〆切 ${time.trim()||'今日'}`,hot:true};if(diff===1)return {text:`〆切 明日${time}`,hot:true};const x=new Date(t.deadline+'T00:00:00');return {text:`〆切 ${x.getMonth()+1}/${x.getDate()}${time}`,hot:diff<=3}}
function deadlineLabel(t){if(!t.deadline)return '〆切なし';const diff=Math.ceil((new Date(t.deadline+'T23:59:59')-Date.now())/86400000);if(diff<0)return `${Math.abs(diff)}日超過`;if(diff===0)return `〆切 今日${t.deadlineTime?' '+hhmm(t.deadlineTime):''}`;if(diff===1)return `〆切 明日${t.deadlineTime?' '+hhmm(t.deadlineTime):''}`;return `〆切 ${fmt(t.deadline)}${t.deadlineTime?' '+hhmm(t.deadlineTime):''}`}
function listHtml(){const all=active();return `<div class="matrix-wrap"><div class="matrix" title="上ほど重要・右ほど緊急"><span class="matrix-y">🧑 ↓　重要度　↑ 👑</span><span class="matrix-x">🚶 ←　緊急度　→ 🏃</span>${all.map((t,i)=>matrixTaskHtml(t,i)).join('')}</div><div class="matrix-count">${all.length}</div></div>`}
function matrixTaskHtml(t,i){const p=matrixPos(t,i),tag=safeTag(t.tag);return `<button class="matrix-task" data-task="${t.id}" style="left:${p.x}%;top:${p.y}%;--accent:${QUADS[t.quad].color}" title="${escAttr(t.content)}">${tag.icon} ${esc(tag.name)} ${priorityIcons(t.quad)} · ${esc(t.content)}</button>`}
function matrixPos(t,i){let seed=0;for(const c of t.id)seed=(seed+c.charCodeAt(0))%997;const j1=((seed*37+i*17)%100)/100,j2=((seed*61+i*29)%100)/100;const right=t.quad==='hh'||t.quad==='lh', high=t.quad==='hh'||t.quad==='hl';return {x:(right?58:13)+j1*29,y:(high?13:58)+j2*29}}
function rowHtml(t){const tag=safeTag(t.tag);return `<div class="list-row" data-task="${t.id}" style="--accent:${QUADS[t.quad].color}"><div class="list-title">${tag.icon} ${esc(tag.name)}　${esc(t.content)}</div><div class="list-meta">${t.planDate?'実行予定 '+fmt(t.planDate):'未計画'} ・ ${deadlineLabel(t)} ・ ★${t.points}</div></div>`}
function planHtml(){const up=unplanned();const dates=[0,1,2,3].map(n=>iso(addDays(new Date(),n)));return `<div class="plan-top"><span class="icon-heading">📅 計画</span><span class="inbox-mini ${needsPlanAttention(up)?'warn':''}" title="未計画">未 ${up.length}</span></div><section class="panel"><div class="load-grid">${dates.map(d=>{const a=active().filter(t=>t.planDate===d);const m=a.reduce((s,t)=>s+(t.minutes||0),0);return `<div class="load-day"><b>${new Date(d+'T00:00:00').getMonth()+1}/${new Date(d+'T00:00:00').getDate()}</b><small>${a.length}<br>${fmtMin(m)}</small></div>`}).join('')}</div></section><section class="panel"><div class="section-title" style="margin-top:0"><span>未 ${up.length}</span><button id="aiPlan" class="ghost" title="AIで日程案">✨</button></div>${up.map(t=>`<div class="list-row plan-row" data-plan="${t.id}" style="--accent:${QUADS[t.quad].color}"><div class="list-title">${safeTag(t.tag).icon} ${esc(safeTag(t.tag).name)} ${priorityIcons(t.quad)}　${esc(t.content)}</div><div class="list-meta"><span>${compactDeadline(t).text||'∞'}</span><span>予測 ${t.minutes||'?'}分</span><span>★${t.points}</span></div><div class="row" style="margin-top:9px"><button class="ghost shift-plan" data-id="${t.id}" data-d="-1">−</button><button class="ghost pick-plan" data-id="${t.id}" title="予定日を決める">📅</button><button class="ghost shift-plan" data-id="${t.id}" data-d="1">＋</button></div></div>`).join('')||'<div class="empty">🎉</div>'}</section>`}
const LANDMARKS={observatory:{icon:'🔭',name:'天文台'},clocktower:{icon:'🕰️',name:'時計塔'},ferris:{icon:'🎡',name:'大観覧車'}};

function tagSettingsModal(){
  const d=ui.tagDrafts; if(!d)return '';

function shiftYearDate(dateStr,delta){const d=new Date(dateStr+'T00:00:00');const m=d.getMonth(),day=d.getDate();const target=d.getFullYear()+delta;const maxDay=new Date(target,m+1,0).getDate();return iso(new Date(target,m,Math.min(day,maxDay)))}
function parseRawDate(raw,year){if(!raw)return '';const s=String(raw);let m,d;if(s.length===3){m=Number(s[0]);d=Number(s.slice(1))}else if(s.length===4){m=Number(s.slice(0,2));d=Number(s.slice(2))}else return '';const x=new Date(year,m-1,d);if(x.getFullYear()!==year||x.getMonth()!==m-1||x.getDate()!==d)return '';return iso(x)}
function normTime(s){s=String(s||'').replace(/\D/g,'').slice(0,4);if(!s)return '';if(s.length<=2)return String(Number(s)).padStart(2,'0')+'00';const h=Math.min(23,Number(s.slice(0,-2))),m=Math.min(59,Number(s.slice(-2)));return String(h).padStart(2,'0')+String(m).padStart(2,'0')}
function hhmm(s){s=normTime(s);return s?`${s.slice(0,2)}:${s.slice(2)}`:''}
function fmtMin(m){if(!m)return '0分';return m>=60?`${Math.floor(m/60)}h${m%60?m%60+'m':''}`:`${m}m`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
